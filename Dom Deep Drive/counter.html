
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2. Click Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="back" href="index.html">← All apps</a>
    <h1>Click Counter</h1>
    <p class="hint">The number turns green when positive, red when negative.</p>

    <div class="box">
        <div class="big" id="count">0</div>

        <div class="row">
            <button id="minusBtn">− 1</button>
            <button id="plusBtn">+ 1</button>
            <button id="resetBtn">Reset</button>
        </div>

        <p id="message">Click a button to start counting.</p>
    </div>

    <script src="counter.js"></script>
</body>
</html>
