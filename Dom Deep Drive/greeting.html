<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1. Name Greeter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a class="back" href="index.html">← All apps</a>
    <h1>Name Greeter</h1>
    <p class="hint">Type your name and press Greet me (or hit Enter).</p>

    <div class="box">
        <input id="nameInput" type="text" placeholder="Your name">

        <div class="row">
            <button id="greetBtn">Greet me</button>
            <button id="clearBtn">Clear</button>
        </div>

        <h2 id="greeting">Hello, stranger!</h2>
        <p id="letterCount">0 letters typed.</p>
    </div>

    <script src="01-greeting.js"></script>
</body>
</html>
